<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Qais's Adventure</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a1a;
      font-family: 'Press Start 2P', monospace;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #game-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    #hud {
      position: absolute;
      top: 0; left: 0; right: 0;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      background: linear-gradient(180deg, rgba(10,10,26,0.9) 0%, transparent 100%);
    }

    #score { color: #ffd700; font-size: 12px; }
    #timer { color: #00ffcc; font-size: 12px; }
    #high-score { color: #ff69b4; font-size: 10px; }

    #canvas-wrapper {
      flex: 1;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 120px;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #touch-controls {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 110px;
      display: flex;
      justify-content: space-between;
      padding: 10px 20px 20px;
      z-index: 10;
    }

    .touch-btn {
      width: 140px;
      height: 80px;
      background: linear-gradient(180deg, #2a1a4a 0%, #1a0a2a 100%);
      border: 3px solid #8b5cf6;
      border-radius: 12px;
      color: #c084fc;
      font-family: 'Press Start 2P', monospace;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4), inset 0 -4px 0 rgba(0,0,0,0.3);
      cursor: pointer;
      transition: transform 0.05s, box-shadow 0.05s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .touch-btn:active, .touch-btn.pressed {
      transform: translateY(3px);
      box-shadow: 0 0 8px rgba(139, 92, 246, 0.3), inset 0 -2px 0 rgba(0,0,0,0.3);
      background: linear-gradient(180deg, #3a2a5a 0%, #2a1a3a 100%);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(10, 10, 26, 0.92);
      z-index: 20;
      gap: 24px;
      padding: 20px;
      cursor: pointer;
    }

    #overlay.hidden { display: none; }

    .overlay-title {
      color: #ffd700;
      font-size: 22px;
      text-align: center;
      line-height: 1.6;
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
    }

    .overlay-subtitle {
      color: #c084fc;
      font-size: 10px;
      text-align: center;
      line-height: 2;
    }

    .overlay-score {
      color: #00ffcc;
      font-size: 12px;
      text-align: center;
    }

    #start-btn {
      background: linear-gradient(180deg, #6b21a8 0%, #3b0a6e 100%);
      border: 3px solid #a855f7;
      border-radius: 12px;
      color: #f0abfc;
      font-family: 'Press Start 2P', monospace;
      font-size: 12px;
      padding: 18px 36px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
      transition: transform 0.1s, box-shadow 0.1s;
      margin-top: 8px;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      min-width: 220px;
      min-height: 60px;
    }

    #start-btn:hover { transform: scale(1.05); }
    #start-btn:active { transform: scale(0.97); background: linear-gradient(180deg, #8b2fc9 0%, #5b1a8e 100%); }

    #confetti-canvas {
      position: absolute;
      inset: 0;
      z-index: 15;
      pointer-events: none;
    }

    .win-title {
      color: #ffd700 !important;
      animation: pulse 0.5s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      from { text-shadow: 0 0 10px rgba(255,215,0,0.6); }
      to { text-shadow: 0 0 30px rgba(255,215,0,1), 0 0 60px rgba(255,215,0,0.5); }
    }

    @media (min-width: 600px) {
      #canvas-wrapper { padding-bottom: 20px; }
      .touch-btn { width: 120px; height: 70px; font-size: 18px; }
    }

    @media (max-height: 500px) {
      #touch-controls { height: 90px; }
      canvas { max-height: 300px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="hud">
    <div id="score">SCORE: 0</div>
    <div id="timer">TIME: 0s</div>
    <div id="high-score">BEST: 0</div>
  </div>

  <div id="canvas-wrapper">
    <canvas id="game"></canvas>
  </div>

  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">&#9664;</button>
    <button class="touch-btn" id="btn-right">&#9654;</button>
  </div>

  <div id="overlay">
    <div class="overlay-title" id="overlay-title">QAIS'S<br>ADVENTURE</div>
    <div class="overlay-subtitle" id="overlay-sub">DODGE THE BIRTHDAY CHAOS!<br>survive 42 seconds to win</div>
    <div class="overlay-score hidden" id="overlay-score"></div>
    <button id="start-btn">START GAME</button>
  </div>

  <canvas id="confetti-canvas"></canvas>
</div>

<script>
// ─── GAME ENGINE ───────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const confCanvas = document.getElementById('confetti-canvas');
const confCtx = confCanvas.getContext('2d');

// State
let gameState = 'start'; // start | playing | win | lose
let score = 0;
let timer = 0;
let lastTime = 0;
let animId = null;
let highScore = parseInt(localStorage.getItem('qais_hs') || '0');

// DOM
const overlay = document.getElementById('overlay');
const overlayTitle = document.getElementById('overlay-title');
const overlaySub = document.getElementById('overlay-sub');
const overlayScore = document.getElementById('overlay-score');
const startBtn = document.getElementById('start-btn');
const scoreEl = document.getElementById('score');
const timerEl = document.getElementById('timer');
const highScoreEl = document.getElementById('high-score');
const btnLeft = document.getElementById('btn-left');
const btnRight = document.getElementById('btn-right');

highScoreEl.textContent = 'BEST: ' + highScore;

// ─── RESIZE ─────────────────────────────────────────────────────────────────
function resize() {
  const wrapper = document.getElementById('canvas-wrapper');
  const maxW = wrapper.clientWidth || window.innerWidth;
  const maxH = wrapper.clientHeight || window.innerHeight;

  // Target 9:16 portrait feel
  let w = maxW;
  let h = maxH;
  if (w / h > 9 / 16) w = Math.floor(h * 9 / 16);
  else h = Math.floor(w * 16 / 9);
  w = Math.min(w, 400);
  h = Math.min(h, 700);

  // Guard against zero
  w = Math.max(w, 1);
  h = Math.max(h, 1);

  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  confCanvas.width = window.innerWidth;
  confCanvas.height = window.innerHeight;
}

window.addEventListener('resize', resize);
resize();

// ─── PLAYER ─────────────────────────────────────────────────────────────────
const player = {
  w: 36, h: 44,
  x: 0, y: 0,
  speed: 280,
  dx: 0,
  invincible: 0,

  reset() {
    if (canvas.width <= 1 || canvas.height <= 1) return;
    this.x = canvas.width / 2 - this.w / 2;
    this.y = canvas.height - this.h - 10;
    this.dx = 0;
    this.invincible = 0;
  },

  update(dt) {
    this.x += this.dx * dt;
    this.x = Math.max(0, Math.min(canvas.width - this.w, this.x));
    if (this.invincible > 0) this.invincible -= dt;
  },

  draw() {
    const px = Math.floor(this.x);
    const py = Math.floor(this.y);
    if (px < -50 || py < -50) return; // skip if way off screen

    const flash = this.invincible > 0 && Math.floor(this.invincible * 10) % 2 === 0;
    if (flash) return;

    // Head
    ctx.fillStyle = '#f4a460'; ctx.fillRect(px+12, py+4, 12, 12);
    // Eyes
    ctx.fillStyle = '#222'; ctx.fillRect(px+14, py+8, 3, 3); ctx.fillRect(px+19, py+8, 3, 3);
    // Smile
    ctx.fillStyle = '#c0392b'; ctx.fillRect(px+15, py+13, 6, 2);
    // Body (purple shirt)
    ctx.fillStyle = '#8b5cf6'; ctx.fillRect(px+10, py+16, 16, 14);
    // Arms
    ctx.fillStyle = '#f4a460'; ctx.fillRect(px+6, py+16, 4, 8); ctx.fillRect(px+26, py+16, 4, 8);
    // Legs
    ctx.fillStyle = '#2d3748'; ctx.fillRect(px+12, py+30, 5, 10); ctx.fillRect(px+19, py+30, 5, 10);
    // Shoes
    ctx.fillStyle = '#e53e3e'; ctx.fillRect(px+11, py+38, 7, 4); ctx.fillRect(px+18, py+38, 7, 4);
  }
};

// ─── OBSTACLES ──────────────────────────────────────────────────────────────
const obstacleDefs = [
  { w: 32, h: 28, label: 'cake'   },
  { w: 28, h: 26, label: 'present' },
  { w: 22, h: 30, label: 'balloon' },
  { w: 24, h: 24, label: 'star'   },
];

let obstacles = [];
let spawnTimer = 0;
const BASE_SPAWN = 1.1;
const WIN_TIME = 42;

function spawnObstacle() {
  const type = Math.floor(Math.random() * obstacleDefs.length);
  const def = obstacleDefs[type];
  const x = Math.random() * Math.max(1, canvas.width - def.w);
  obstacles.push({
    x, y: -def.h,
    w: def.w, h: def.h,
    type,
    speed: 100 + Math.random() * 120 + timer * 2,
    rotation: 0,
    rotSpeed: (Math.random() - 0.5) * 3,
    wobble: Math.random() * Math.PI * 2,
    wobbleSpeed: 2 + Math.random() * 2,
    wobbleAmp: 0.4 + Math.random() * 0.4,
  });
}

function drawObstacle(o) {
  const px = Math.floor(o.x);
  const py = Math.floor(o.y);

  ctx.save();
  ctx.translate(px + o.w/2, py + o.h/2);
  ctx.rotate(o.rotation);

  switch (o.type) {
    case 0: // Cake
      ctx.fillStyle = '#fff'; ctx.fillRect(-14, 6, 28, 5);
      ctx.fillStyle = '#ff69b4'; ctx.fillRect(-12, -4, 24, 12);
      ctx.fillStyle = '#fff'; ctx.fillRect(-12, -6, 4, 4);
      ctx.fillRect(-4, -8, 4, 6); ctx.fillRect(4, -6, 4, 4); ctx.fillRect(10, -7, 4, 5);
      ctx.fillStyle = '#ffd700'; ctx.fillRect(-2, -14, 4, 8);
      ctx.fillStyle = '#ff6600'; ctx.fillRect(-2, -18, 4, 4);
      ctx.fillStyle = '#ffff00'; ctx.fillRect(-1, -17, 2, 3);
      break;
    case 1: // Present
      ctx.fillStyle = '#ffd700'; ctx.fillRect(-12, -6, 24, 18);
      ctx.fillStyle = '#e53e3e'; ctx.fillRect(-3, -6, 6, 18);
      ctx.fillRect(-12, 1, 24, 5);
      ctx.fillStyle = '#e53e3e';
      ctx.fillRect(-10, -12, 7, 8); ctx.fillRect(3, -12, 7, 8);
      ctx.fillStyle = '#ff6666'; ctx.fillRect(-8, -10, 4, 4); ctx.fillRect(4, -10, 4, 4);
      ctx.fillStyle = '#fff'; ctx.fillRect(8, -3, 6, 8);
      ctx.fillStyle = '#333'; ctx.fillRect(9, 0, 4, 2);
      break;
    case 2: // Balloon
      ctx.fillStyle = '#aaa'; ctx.fillRect(-1, 6, 2, 10);
      ctx.fillStyle = '#ff4444'; ctx.fillRect(-8, -14, 16, 18);
      ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fillRect(-6, -12, 5, 8);
      ctx.fillStyle = '#cc0000'; ctx.fillRect(-3, 4, 6, 4);
      break;
    case 3: // Star
      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(-8, -3, 16, 6);
      ctx.fillRect(-3, -8, 6, 16);
      ctx.fillStyle = '#ffd700';
      ctx.fillRect(-4, -4, 8, 8);
      break;
  }

  ctx.restore();
}

function checkCollision(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// ─── BACKGROUND STARS ───────────────────────────────────────────────────────
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 60; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height * 0.75,
      size: Math.random() < 0.7 ? 1 : 2,
      speed: 10 + Math.random() * 20,
      brightness: 0.3 + Math.random() * 0.7,
    });
  }
}
initStars();

function drawBackground(dt) {
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#0a0a1a');
  grad.addColorStop(0.6, '#1a0a2e');
  grad.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  stars.forEach(s => {
    s.y += s.speed * dt;
    if (s.y > canvas.height * 0.75) {
      s.y = -2; s.x = Math.random() * canvas.width;
    }
    const twinkle = 0.6 + 0.4 * Math.sin(Date.now() * 0.003 + s.x);
    ctx.fillStyle = `rgba(255,255,255,${s.brightness * twinkle})`;
    ctx.fillRect(Math.floor(s.x), Math.floor(s.y), s.size, s.size);
  });

  ctx.fillStyle = '#1a0a2e';
  ctx.fillRect(0, canvas.height - 8, canvas.width, 8);
  ctx.fillStyle = 'rgba(139,92,246,0.15)';
  ctx.fillRect(0, canvas.height - 12, canvas.width, 4);
}

// ─── CONFETTI ───────────────────────────────────────────────────────────────
let confetti = [];
const CONFETTI_COLORS = ['#ffd700', '#ff69b4', '#00ffcc', '#a855f7', '#ff4444', '#00ff88', '#ff6600'];

function spawnConfetti() {
  confetti = [];
  for (let i = 0; i < 120; i++) {
    confetti.push({
      x: Math.random() * confCanvas.width,
      y: -10 - Math.random() * 300,
      w: 6 + Math.random() * 8,
      h: 4 + Math.random() * 6,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vx: (Math.random() - 0.5) * 4,
      vy: 2 + Math.random() * 4,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 8,
      swirl: Math.random() * Math.PI * 2,
      swirlSpeed: 1 + Math.random() * 2,
    });
  }
}

function drawConfetti(dt) {
  confCtx.clearRect(0, 0, confCanvas.width, confCanvas.height);
  confetti.forEach(c => {
    c.x += c.vx + Math.sin(c.swirl) * 1.5;
    c.y += c.vy;
    c.rotation += c.rotSpeed * dt;
    c.swirl += c.swirlSpeed * dt;
    if (c.vy < 8) c.vy += 0.05;

    confCtx.save();
    confCtx.translate(c.x, c.y);
    confCtx.rotate(c.rotation);
    confCtx.fillStyle = c.color;
    confCtx.fillRect(-c.w/2, -c.h/2, c.w, c.h);
    confCtx.restore();
  });
}

// ─── INPUT ──────────────────────────────────────────────────────────────────
const keys = { left: false, right: false };

// Keyboard
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
  if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (gameState === 'start' || gameState === 'lose' || gameState === 'win') startGame();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

// ─── GAME START ─────────────────────────────────────────────────────────────
function startGame() {
  if (gameState === 'playing') return; // guard
  gameState = 'playing';
  score = 0;
  timer = 0;
  obstacles = [];
  spawnTimer = 0;
  player.reset();
  overlay.classList.add('hidden');
  lastTime = performance.now();
  if (animId) cancelAnimationFrame(animId);
  animId = requestAnimationFrame(loop);
}

// Clicking the button OR the overlay starts the game
startBtn.addEventListener('click', e => { e.preventDefault(); startGame(); });
startBtn.addEventListener('touchend', e => { e.preventDefault(); startGame(); });
overlay.addEventListener('click', e => { if (e.target === overlay) startGame(); });

// Touch controls — only react to touch on the buttons themselves
function addTouchEvents(btn, dir) {
  const start = e => { e.stopPropagation(); keys[dir] = true; btn.classList.add('pressed'); };
  const end = e => { e.stopPropagation(); keys[dir] = false; btn.classList.remove('pressed'); };
  btn.addEventListener('touchstart', start, { passive: true });
  btn.addEventListener('touchend', end, { passive: true });
  btn.addEventListener('touchcancel', end, { passive: true });
  btn.addEventListener('mousedown', e => { e.stopPropagation(); keys[dir] = true; btn.classList.add('pressed'); });
  btn.addEventListener('mouseup', e => { e.stopPropagation(); keys[dir] = false; btn.classList.remove('pressed'); });
  btn.addEventListener('mouseleave', e => { keys[dir] = false; btn.classList.remove('pressed'); });
}

addTouchEvents(btnLeft, 'left');
addTouchEvents(btnRight, 'right');

// ─── GAME LOOP ──────────────────────────────────────────────────────────────
function loop(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  if (gameState === 'playing') {
    timer += dt;

    player.dx = 0;
    if (keys.left) player.dx = -player.speed;
    if (keys.right) player.dx = player.speed;
    player.update(dt);

    const spawnRate = Math.max(0.35, BASE_SPAWN - timer * 0.015);
    spawnTimer += dt;
    if (spawnTimer >= spawnRate) {
      spawnObstacle();
      spawnTimer = 0;
    }

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.speed * dt;
      o.rotation += o.rotSpeed * dt;
      o.wobble += o.wobbleSpeed * dt;
      o.x += Math.sin(o.wobble) * o.wobbleAmp;

      if (o.y > canvas.height + 50) {
        obstacles.splice(i, 1);
        score++;
        continue;
      }

      if (player.invincible <= 0 && checkCollision(player, o)) {
        gameOver(false);
        return;
      }
    }

    scoreEl.textContent = 'SCORE: ' + score;
    timerEl.textContent = 'TIME: ' + Math.floor(timer) + 's';

    if (timer >= WIN_TIME) {
      gameOver(true);
      return;
    }
  }

  drawBackground(dt);
  if (gameState === 'playing' || gameState === 'lose') {
    obstacles.forEach(drawObstacle);
    player.draw();
  }

  if (gameState === 'win') {
    drawConfetti(dt);
  }

  animId = requestAnimationFrame(loop);
}

function gameOver(won) {
  gameState = won ? 'win' : 'lose';
  cancelAnimationFrame(animId);

  if (score > highScore) {
    highScore = score;
    localStorage.setItem('qais_hs', highScore);
    highScoreEl.textContent = 'BEST: ' + highScore;
  }

  if (won) {
    spawnConfetti();
    overlayTitle.innerHTML = 'HAPPY 42ND<br>BIRTHDAY QAIS!';
    overlayTitle.className = 'overlay-title win-title';
    overlaySub.innerHTML = 'you survived the birthday chaos!';
    overlayScore.innerHTML = 'FINAL SCORE: ' + score + '<br>time: ' + WIN_TIME + 's';
    overlayScore.className = 'overlay-score';
    startBtn.textContent = 'PLAY AGAIN';
    gameState = 'win';
    lastTime = performance.now();
    animId = requestAnimationFrame(loop);
  } else {
    overlayTitle.innerHTML = 'GAME OVER';
    overlayTitle.className = 'overlay-title';
    overlaySub.innerHTML = 'hit by a birthday surprise!';
    overlayScore.innerHTML = 'SCORE: ' + score + '<br>TIME: ' + Math.floor(timer) + 's';
    overlayScore.className = 'overlay-score';
    startBtn.textContent = 'TRY AGAIN';
    drawBackground(0);
    obstacles.forEach(drawObstacle);
    player.draw();
  }

  overlay.classList.remove('hidden');
}

// ─── INIT ───────────────────────────────────────────────────────────────────
drawBackground(0);
player.reset();
player.invincible = 999;
player.draw();
</script>
</body>
</html>
